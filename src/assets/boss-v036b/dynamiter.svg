<title id="title">Dynamiteur — master statique, variante B</title>
<desc id="desc">Artificier minier humanoïde massif en trois quarts face. Casque ocre à lampe, charges rouges dorsales, ceinture large et détonateur rectangulaire à poignée en T et triangle ocre. Pose unique, aplats sans halo.</desc>
