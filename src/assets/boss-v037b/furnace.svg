<svg xmlns="http://www.w3.org/2000/svg" width="450" height="450" viewBox="0 0 450 450" role="img" aria-labelledby="title desc">
<title id="title">Maître de Four — variante A rouge forge, master statique</title>
<desc id="desc">Boss humanoïde massif en trois quarts face, petite tête sombre à deux yeux orange, énormes épaules rouges, torse-four à trois ouvertures incandescentes, cheminée haute, poing lourd et module industriel porté à droite de l'image. Appuis écartés. Aplats sans halo ni VFX.</desc>
