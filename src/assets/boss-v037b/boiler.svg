<svg xmlns="http://www.w3.org/2000/svg" width="625" height="525" viewBox="25 325 625 525" role="img" aria-labelledby="title desc">
<title id="title">Chaudière — version A rouge Zone 6, master statique</title>
<desc id="desc">Chaudière mécanique rouge en trois quarts, cuve ronde et massive, cheminée centrale sans fumée, gros tuyau coudé à gauche, cadran clair au-dessus du foyer rond à trois ouvertures chaudes. Épaules rouges, bras lourds et appuis courts écartés. Aplats sans halo, sans flamme ni VFX permanent.</desc>
