<svg xmlns="http://www.w3.org/2000/svg" width="570" height="490" viewBox="110 150 570 490" role="img" aria-labelledby="title desc">
<title id="title">Marteau-Pilon — version B rouge Zone 6, master statique</title>
<desc id="desc">Boss mécanique trapu en trois quarts face, casque rouge à lampe frontale, deux yeux orange, larges épaules rouges, torse sombre et pieds industriels écartés. À droite, un pilon hydraulique vertical plus haut que la tête : tuyau principal, montant sombre, cylindre acier, carter rayé rouge et noir, piston inférieur et masse rectangulaire au sol. Pose de la référence B, sans effet diffus.</desc>
